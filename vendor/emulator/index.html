<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
      #game { display: flex; align-items: center; justify-content: center; color: #bbb; font: 14px system-ui, sans-serif; }
      html.gba-hide-menu .ejs_menu_bar { opacity: 0 !important; pointer-events: none !important; transform: translateY(100%) !important; }
    </style>
  </head>
  <body>
    <div id="game">ROM을 불러오는 중…</div>
    <script>
      (() => {
        let romLoadingStarted = false;
        let gameStarted = false;
        let reportedError = false;
        let romUrl = null;
        let initialSaveBytes = null;
        document.documentElement.classList.add("gba-hide-menu");

        const reportError = (message) => {
          if (reportedError) return;
          reportedError = true;
          window.parent.postMessage({ type: "gba:error", message }, "*");
        };

        const errorMessage = (reason) => {
          if (reason instanceof Error && reason.message) return reason.message;
          if (typeof reason === "string" && reason) return reason;
          return "에뮬레이터 엔진을 시작하지 못했습니다.";
        };

        window.parent.postMessage({ type: "gba:ready" }, "*");

        window.addEventListener("error", (event) => {
          if (gameStarted) return;
          if (event.target instanceof HTMLScriptElement) {
            reportError("에뮬레이터 구성 파일을 불러오지 못했습니다.");
            return;
          }
          reportError(errorMessage(event.error || event.message));
        }, true);

        window.addEventListener("unhandledrejection", (event) => {
          if (!gameStarted) reportError(errorMessage(event.reason));
        });

        window.addEventListener("message", (event) => {
          const payload = event.data;
          if (payload && payload.type === "gba:request-save") {
            sendSaveData();
            return;
          }
          if (payload && payload.type === "gba:toggle-settings") {
            toggleSettings(Boolean(payload.visible));
            return;
          }
          if (romLoadingStarted || !payload || payload.type !== "gba:load-rom" || !(payload.bytes instanceof ArrayBuffer) || typeof payload.loaderUrl !== "string" || typeof payload.dataUrl !== "string") return;

          romLoadingStarted = true;
          initialSaveBytes = payload.saveBytes instanceof ArrayBuffer ? payload.saveBytes : null;
          romUrl = URL.createObjectURL(new Blob([payload.bytes], { type: "application/octet-stream" }));
          window.EJS_player = "#game";
          window.EJS_core = "gba";
          window.EJS_gameUrl = romUrl;
          window.EJS_gameName = payload.name;
          window.EJS_pathtodata = payload.dataUrl;
          window.EJS_disableAutoLang = false;
          window.EJS_startOnLoaded = true;
          window.EJS_onGameStart = () => {
            restoreInitialSave();
            gameStarted = true;
            window.parent.postMessage({ type: "gba:started" }, "*");
          };

          const loader = document.createElement("script");
          loader.src = payload.loaderUrl;
          loader.onerror = () => reportError("EmulatorJS 파일을 불러오지 못했습니다.");
          document.body.appendChild(loader);
        });

        function restoreInitialSave() {
          if (!initialSaveBytes) return;
          const manager = window.EJS_emulator && window.EJS_emulator.gameManager;
          if (!manager) return;

          try {
            manager.FS.writeFile(manager.getSaveFilePath(), new Uint8Array(initialSaveBytes));
            manager.loadSaveFiles();
          } catch (error) {
            reportError(errorMessage(error));
          } finally {
            initialSaveBytes = null;
          }
        }

        function sendSaveData() {
          const manager = window.EJS_emulator && window.EJS_emulator.gameManager;
          if (!gameStarted || !manager) {
            window.parent.postMessage({ type: "gba:no-save" }, "*");
            return;
          }

          try {
            const bytes = manager.getSaveFile(true);
            if (!bytes || bytes.byteLength === 0) {
              window.parent.postMessage({ type: "gba:no-save" }, "*");
              return;
            }
            const snapshot = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
            window.parent.postMessage({ type: "gba:save-data", bytes: snapshot }, "*", [snapshot]);
          } catch (error) {
            reportError(errorMessage(error));
          }
        }

        function toggleSettings(visible) {
          document.documentElement.classList.toggle("gba-hide-menu", !visible);
          const emulator = window.EJS_emulator;
          if (!emulator || !emulator.menu) return;

          if (visible) {
            emulator.menu.open(true);
            emulator.settingParent && emulator.settingParent.click();
          } else {
            emulator.menu.close();
          }
        }

        window.addEventListener("beforeunload", () => { if (romUrl) URL.revokeObjectURL(romUrl); });
      })();
    </script>
  </body>
</html>
